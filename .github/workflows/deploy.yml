name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Source-rights gate tests
        run: npm run rights:test
      - name: Source-rights records and pinned upstream notes
        run: node scripts/check-source-rights.mjs --verify-upstream
      - name: Build site
        run: npm run build
      - name: Validate rendered practice links
        run: npm run practice:check -- --dist dist
      - name: Browser for changed course notes
        run: npx playwright install --with-deps chromium
      - name: Review changed notes on phones and desktop
        env:
          REVIEW_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-renewal-browser.mjs
      - name: Save course page review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewal-browser
          path: artifacts/renewal-browser
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
